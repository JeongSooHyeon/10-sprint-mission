spring:
  datasource:
    url: jdbc:h2:mem:test-practice;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8080

logging:
  level:
    root: INFO
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: DEBUG

info:
  config:
    datasource:
      url: jdbc:h2:mem:test-practice
      driver-class-name: org.h2.Driver
    jpa:
      ddl-auto: update
    storage:
      type: local
      path: ./storage
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB